# New-API Docker Compose Configuration
#
# Quick Start:
#   1. docker-compose up -d
#   2. Access New-API at http://localhost:3000
#   3. Access Open-WebUI at http://localhost:8000
#
# Using MySQL instead of PostgreSQL:
#   1. Comment out the postgres service and SQL_DSN line 30
#   2. Uncomment the mysql service and SQL_DSN line 31
#   3. Uncomment mysql in depends_on (line 45)
#   4. Uncomment mysql_data in volumes section (line 119)
#
# Auto Updates (Watchtower):
#   - Automatically updates containers every 12 hours
#   - Removes old images after updates to save space
#   - To disable: comment out the watchtower service (lines 105-114)
#   - To check update logs: docker logs watchtower
#
# ⚠️  IMPORTANT: Change all default passwords before deploying to production!
# ⚠️  Watchtower will restart services automatically during updates

version: '3.4' # For compatibility with older Docker versions

services:
  new-api:
    image: calciumion/new-api:latest
    container_name: new-api
    restart: always
    command: --log-dir /app/logs
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./data:/data
      - ./logs:/app/logs
    environment:
      - BASE_URL=/api
      - SQL_DSN=postgresql://root:123456@postgres:5432/new-api # ⚠️ IMPORTANT: Change the password in production!
#      - SQL_DSN=root:123456@tcp(mysql:3306)/new-api  # Point to the mysql service, uncomment if using MySQL
      - REDIS_CONN_STRING=redis://redis
      - TZ=Asia/Shanghai
      - ERROR_LOG_ENABLED=true # 是否启用错误日志记录 (Whether to enable error log recording)
      - BATCH_UPDATE_ENABLED=true  # 是否启用批量更新 (Whether to enable batch update)
#      - STREAMING_TIMEOUT=300  # 流模式无响应超时时间，单位秒，默认120秒，如果出现空补全可以尝试改为更大值 （Streaming timeout in seconds, default is 120s. Increase if experiencing empty completions）
#      - SESSION_SECRET=random_string  # 多机部署时设置，必须修改这个随机字符串！！ （multi-node deployment, set this to a random string!!!!!!!）
#      - SYNC_FREQUENCY=60  # Uncomment if regular database syncing is needed
#      - GOOGLE_ANALYTICS_ID=G-XXXXXXXXXX  # Google Analytics 的测量 ID (Google Analytics Measurement ID)
#      - UMAMI_WEBSITE_ID=xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx  # Umami 网站 ID (Umami Website ID)
#      - UMAMI_SCRIPT_URL=https://analytics.umami.is/script.js  # Umami 脚本 URL，默认为官方地址 (Umami Script URL, defaults to official URL)

    depends_on:
      - redis
      - postgres
#      - mysql  # Uncomment if using MySQL
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/status | grep -o '\"success\":\\s*true' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

      # -----------------------------------------------------
  # 新增: Open-WebUI 服务
  # -----------------------------------------------------
  open-webui:
    image: ghcr.io/open-webui/open-webui:main-slim
    container_name: open-webui
    restart: always
    ports:
      - "127.0.0.1:8000:8080" # 同样只绑定到 localhost，更安全
    volumes:
      - open-webui-data:/app/backend/data
    extra_hosts: # 等同于 docker run 的 --add-host
      - "host.docker.internal:host-gateway"
      # 关键步骤：在这里配置 OpenWebUI 去连接 new-api
      # 注意：这里的 OPENAI_API_BASE_URL 只是一个示例变量名
      # 你需要查阅 OpenWebUI 的文档，找到配置后端 API 地址的环境变量
      # 并将它的值设置为 "http://new-api:3000/api"
    depends_on:
      - new-api # 让 open-webui 在 new-api 启动之后再启动
    # networks:
    #   - app-network
    
  redis:
    image: redis:latest
    container_name: redis
    restart: always

  postgres:
    image: postgres:15
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: 123456  # ⚠️ IMPORTANT: Change this password in production!
      POSTGRES_DB: new-api
    volumes:
      - pg_data:/var/lib/postgresql/data
#    ports:
#      - "5432:5432"  # Uncomment if you need to access PostgreSQL from outside Docker

#  mysql:
#    image: mysql:8.2
#    container_name: mysql
#    restart: always
#    environment:
#      MYSQL_ROOT_PASSWORD: 123456  # ⚠️ IMPORTANT: Change this password in production!
#      MYSQL_DATABASE: new-api
#    volumes:
#      - mysql_data:/var/lib/mysql
#    ports:
#      - "3306:3306"  # Uncomment if you need to access MySQL from outside Docker

  # 自动更新服务 - Watchtower
  # Watchtower monitors running containers and automatically updates them when new images are available
  watchtower:
    image: nickfedor/watchtower:latest
    container_name: watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock  # Required to control Docker daemon
    environment:
      - WATCHTOWER_CLEANUP=true  # Remove old images after updating to save disk space
      - WATCHTOWER_POLL_INTERVAL=43200  # Check for updates every 12 hours (43200 seconds)
      # Uncomment below for more configuration options:
      # - WATCHTOWER_INCLUDE_RESTARTING=true  # Update containers that are restarting
      # - WATCHTOWER_INCLUDE_STOPPED=false   # Don't update stopped containers
      # - WATCHTOWER_ROLLING_RESTART=true     # Update containers one by one to minimize downtime
      # - WATCHTOWER_NOTIFICATIONS=slack      # Enable notifications (requires webhook URL)
    command: --interval 43200 --cleanup  # Command line options for interval and cleanup

volumes:
  pg_data:
  open-webui-data: # 为 open-webui 新增的数据卷
#  mysql_data:

# =======================================================
# Production Deployment & Security Notes
# =======================================================
#
# 1. SECURITY:
#    - Change ALL default passwords before production deployment
#    - Consider using Docker secrets or .env files for sensitive data
#    - Update POSTGRES_PASSWORD, MYSQL_ROOT_PASSWORD, and SQL_DSN
#    - Review and adjust port bindings for your security requirements
#
# 2. WATCHTOWER IN PRODUCTION:
#    - Test updates in staging before production deployment
#    - Consider setting up a notification webhook for update alerts
#    - For critical services, consider manual updates instead of automatic
#    - Monitor watchtower logs: docker logs watchtower -f
#
# 3. MONITORING:
#    - Monitor container health: docker-compose ps
#    - Check logs: docker-compose logs [service-name]
#    - Set up proper backup strategies for databases
#
# 4. BACKUP STRATEGIES:
#    - Regularly backup pg_data and open-webui-data volumes
#    - Export database dumps: docker exec postgres pg_dump -U root new-api > backup.sql
#
# 5. PERFORMANCE:
#    - Adjust resource limits based on your usage patterns
#    - Consider using docker-compose.yml with deploy.resources for production
#
# For more information about Watchtower:
# https://watchtower.nickfedor.com
# For New-API documentation:
#   https://github.com/Calcium-Ion/new-api
